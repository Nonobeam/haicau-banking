services:
  central-banking:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["apps"]
    working_dir: /workspace
    command: >
      bash -lc "mvn -f hcau-central-banking/pom.xml -DskipTests spring-boot:run"
    ports:
      - "8081:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PORT: 8080
    volumes:
      - ./:/workspace
      - maven-repo-central:/root/.m2
    depends_on:
      - postgres
      - kafka
    networks:
      - ledger-net

  banking-reconcile:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["apps"]
    working_dir: /workspace
    command: >
      bash -lc "mvn -f hcau-banking-module-common/pom.xml -DskipTests install && mvn -f hcau-banking-common/pom.xml -DskipTests install && mvn -f hcau-banking-reconcile-common/pom.xml -DskipTests install && mvn -f hcau-banking-reconcile/pom.xml -DskipTests spring-boot:run"
    ports:
      - "8082:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PORT: 8080
    volumes:
      - ./:/workspace
      - maven-repo-reconcile:/root/.m2
    depends_on:
      - postgres
      - kafka
    networks:
      - ledger-net

volumes:
  maven-repo-central:
  maven-repo-reconcile:
