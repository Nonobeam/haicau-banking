spring:
  application:
    name: hcau-general-ledger
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:general-ledger}
    open-in-view: ${VIEW_JPA:false}

  flyway:
    schemas: ${DB_SCHEMA:general-ledger}
    default-schema: ${DB_SCHEMA:general-ledger}
    create-schemas: true

  messages:
    basename: messages
    use-code-as-default-message: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${PORT:8080}

hcau:
  service:
    id: ${HCAU_SERVICE_ID:101}
  account:
    dedup-ttl: ${ACCOUNT_DEDUP_TTL:PT10M}
  instance:
    id: ${INSTANCE_ID:${spring.application.name}-${random.uuid}}
  gate:
    instance-limit: 500
    recovery-threshold: 350
    probe-pct: 10
    user-limit: 10
    user-circuit-cooldown-seconds: 30
  batch:
    drain-interval-ms: 2
    max-size: 500
  startup:
    prewarm-enabled: true
    prewarm-timeout-seconds: 120
  health:
    failure-threshold: 10
    failure-window-seconds: 60
  dead-letter:
    max-auto-retry: 3
    retry-job-interval-minutes: 5
    alert-threshold: 10
    alert-job-interval-minutes: 10
  recovery:
    auto-reopen-after-db-recovery: false
  kafka:
    topics:
      saga-completed: "saga.completed"
      dead-letter-review: "dead-letter.review"
      notification-email: ${HCAU_KAFKA_NOTI_EMAIL_TOPIC:notification.email}
      notification-telegram: ${HCAU_KAFKA_NOTI_TELEGRAM_TOPIC:notification.telegram}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    export:
      prometheus:
        enabled: true

internal:
  channels:
    platform-service:
      url: ${PLATFORM_SERVICE_URL:http://localhost:8083}
      connect-timeout-ms: 1000
      read-timeout-ms: 5000
    banking-reconcile:
      url: ${BANKING_RECONCILE_URL:http://localhost:18082}
      connect-timeout-ms: 1000
      read-timeout-ms: 5000
