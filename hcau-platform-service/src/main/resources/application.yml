spring:
  application:
    name: hcau-platform-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:platform-service}
    open-in-view: ${VIEW_JPA:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${PORT:8083}

hcau:
  service:
    id: ${HCAU_SERVICE_ID:100}
  instance:
    id: ${INSTANCE_ID:${spring.application.name}-${random.uuid}}
  gate:
    instance-limit: 150
    recovery-threshold: 100
    probe-pct: 10
  startup:
    prewarm-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    export:
      prometheus:
        enabled: true

credentials:
  # Default is a placeholder that lets the service start locally; real key must be set in production
  encryption-key: ${CREDENTIALS_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

internal:
  channels:
    general-ledger:
      url: ${GENERAL_LEDGER_URL:http://localhost:8080}
      endpoints:
        create-account: ${GL_ENDPOINT_CREATE_ACCOUNT:/api/v1/accounts}
        create-currency-account: ${GL_ENDPOINT_CREATE_CURRENCY_ACCOUNT:/api/v1/accounts/currency}
