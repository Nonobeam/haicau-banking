spring:
  application:
    name: hcau-general-ledger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:general-ledger}
    open-in-view: ${VIEW_JPA:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${PORT:8080}

stub:
  enabled: ${STUB_ENABLED:false}

system:
  user-id: ${SYSTEM_USER_ID:user_00000000000000000000000000SYSTEM}

