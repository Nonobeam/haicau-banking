spring:
  application:
    name: hcau-loyalty-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:central-banking}?currentSchema=${DB_SCHEMA:loyalty-service}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:loyalty-service}
  flyway:
    schemas: ${DB_SCHEMA:loyalty-service}
    default-schema: ${DB_SCHEMA:loyalty-service}
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: loyalty-service
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}

hcau:
  service:
    id: ${HCAU_SERVICE_ID:103}
  loyalty:
    event-dedup-ttl: ${LOYALTY_EVENT_DEDUP_TTL:PT24H}
    provision-dedup-ttl: ${LOYALTY_PROVISION_DEDUP_TTL:PT10M}
    batch-flush-ms: ${LOYALTY_BATCH_FLUSH_MS:500}
  kafka:
    topics:
      transactions-committed: "transactions.committed"

internal:
  channels:
    general-ledger:
      url: ${GENERAL_LEDGER_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    export:
      prometheus:
        enabled: true
